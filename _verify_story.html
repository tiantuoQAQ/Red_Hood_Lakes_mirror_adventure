<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<title>verify-story</title>
<style>
  html,body{margin:0;background:#000}
  canvas{display:block;width:1280px;height:720px}
  .cap{color:#888;font:14px monospace;padding:4px 8px}
</style>
</head>
<body>
<canvas id="c1" width="1280" height="720"></canvas>
<div class="cap">① 章节卡 card</div>
<canvas id="c2" width="1280" height="720"></canvas>
<div class="cap">② 场景气泡 bubble</div>
<canvas id="c3" width="1280" height="720"></canvas>
<div class="cap">③ 双立绘对峙 duel</div>
<canvas id="c4" width="1280" height="720"></canvas>
<div class="cap">④ 新角色登场介绍 intro</div>
<canvas id="c5" width="1280" height="720"></canvas>
<div class="cap">⑤ 战斗前特写 bossIntro</div>
<canvas id="c6" width="1280" height="720"></canvas>
<div class="cap">⑥ 信 letter</div>
<canvas id="c7" width="1280" height="720"></canvas>
<div class="cap">⑦ 遭遇对话（立绘 + 红字抖动）</div>
<canvas id="c8" width="1280" height="720"></canvas>
<div class="cap">⑧ CG 占位（法环陷阱）</div>
<canvas id="c9" width="1280" height="720"></canvas>
<div class="cap">⑨ 空白世界 · 走位 + 按 W 交互</div>
<canvas id="c10" width="1280" height="720"></canvas>
<div class="cap">⑩ 称号竖幅 title</div>
<canvas id="c11" width="1280" height="720"></canvas>
<div class="cap">⑪ 镜子 · 走位交互</div>

<script src="src/config.js"></script>
<script src="src/input.js"></script>
<script src="src/gfx.js"></script>
<script src="src/patterns.js"></script>
<script src="src/sprites.js"></script>
<script src="src/fx.js"></script>
<script src="src/audio.js"></script>
<script src="src/story.js"></script>
<script src="src/game.js"></script>
<script src="src/cutscene.js"></script>
<script src="src/render.js"></script>
<script>
  // 离线校验页：把三种演出形式各画一遍，用于截图确认排版。
  resetGame('marysue');
  Game.mode = 'story';
  var S = Cutscene.state;
  Cutscene.start('prologue');      // 初始化场景
  S.bg = 'forest';
  S.black = 0;
  S.t = 60;                        // 让入场动画走完（真实游戏里由 update 推进）

  function drawAll() {
    // ① 章节卡
    S.card = { line1: '悲愤交加的勇者', line2: '踏上了寻回珍视之人的旅途', t: 60 };
    S.text = null;
    S.intro = null;
    S.bossIntro = null;
    Cutscene.draw(document.getElementById('c1').getContext('2d'));

    // ② 场景气泡
    S.card = null;
    S.text = {
      mode: 'bubble', who: '蕾克', shown: 99, acc: 0, pause: 0, t: 30,
      text: '这次不会再让你跑掉了。'
    };
    Cutscene.draw(document.getElementById('c2').getContext('2d'));

    // ③ 双立绘对峙
    S.text = {
      mode: 'duel', who: '', shown: 99, acc: 0, pause: 0, t: 30,
      text: '没用的孩子。你已经没有价值了。',
      left: '蕾克', right: '玛丽苏'
    };
    Cutscene.draw(document.getElementById('c3').getContext('2d'));

    // ④ 角色登场介绍
    S.text = null;
    S.intro = { id: 'marysue' };
    Cutscene.draw(document.getElementById('c4').getContext('2d'));

    // ⑤ 战斗前特写
    S.intro = null;
    S.bossIntro = { id: 'rek_crimson' };
    Cutscene.draw(document.getElementById('c5').getContext('2d'));

    // ⑥ 信
    S.bossIntro = null;
    S.text = {
      mode: 'letter', who: '', shown: 9999, acc: 0, pause: 0, t: 40,
      text: '格林：\n我要走了。\n这一次，我不知道自己还能不能回来。\n我知道，这只是我的任性。\n请你原谅我。\n我不想把你卷进这件事里来。\n我不会让这个世界如她所愿。\n只要我还活着，这个故事就永远不会结束。'
    };
    Cutscene.draw(document.getElementById('c6').getContext('2d'));

    // ⑦ 遭遇对话：立绘 + 红字抖动
    S.text = {
      mode: 'say', who: 'rek', shown: 9999, acc: 0, pause: 0, t: 40,
      expr: 'eyes_open', style: 'red', shake: true, bump: false,
      text: '玛丽苏…在砍下你的头颅之前，我是不会死的。'
    };
    S.portrait = { who: 'rek', expr: 'eyes_open' };
    Cutscene.draw(document.getElementById('c7').getContext('2d'));

    // ⑧ CG 占位
    S.text = null;
    S.portrait = null;
    S.cg = { art: 'art/cg/trap.png', label: '法环陷阱', t: 40 };
    Cutscene.draw(document.getElementById('c8').getContext('2d'));

    // ⑨ 空白世界走位
    S.cg = null;
    startWalk({ bg: 'void', npc: 'norden', npcX: 980, next: 'wake_talk' });
    Game.player.x = 900;
    render(document.getElementById('c9').getContext('2d'));

    // ⑩ 称号竖幅
    Game.mode = 'story';
    S.t = 60;
    S.title = { who: 'norden', title: '白之女王 · 观察者', t: 0 };
    S.portrait = null;
    Cutscene.draw(document.getElementById('c10').getContext('2d'));

    // ⑪ 镜子走位
    S.title = null;
    startWalk({ bg: 'void', target: { kind: 'mirror', x: 1040 }, next: 'enter_mirror' });
    Game.player.x = 960;
    render(document.getElementById('c11').getContext('2d'));
  }

  try { drawAll(); } catch (e) { document.title = 'ERR: ' + e.message; }
  // 立绘是异步加载的：加载完再重画一遍，否则截到的是占位块
  setTimeout(drawAll, 600);
  setTimeout(drawAll, 1200);
</script>
</body>
</html>
